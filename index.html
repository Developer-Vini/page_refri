<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Pagina de refri - Vinicius</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main>
        <div class="item active" style="--background: #2D5643;">
            <div class="titulo">Avocadoo</div>
            <img src="img/Abacate-refrigerante-foregroundBlur.png" alt="refrigerante abacate" class="fruit">
            <img src="img/Abacate-refrigerante.png" alt="refrigerante abacate" class="refri">
        </div>
        <div class="item" style="--background: #E7A043;">
            <div class="titulo">Orange</div>
            <img src="img/Laranja-refrigerante-foregroundBlur.png" alt="refrigerante laranja" class="fruit">
            <img src="img/Laranja-refrigerante.png" alt="refrigerante laranja" class="refri">
        </div>
        <div class="item" style="--background: #EA3D41;">
            <div class="titulo">Strawberry</div>
            <img src="img/Morango-refrigerante-foregroundBlur.png" alt="refrigerante morango" class="fruit">
            <img src="img/Morango-refrigerante.png" alt="refrigerante morango" class="refri">
        </div>

        <div class="arrow">
            <button id="prev"> < </button>
            <button id="next"> > </button>
        </div>
    </main>

    <script src="script.js"></script>
    
</body>
</html>
